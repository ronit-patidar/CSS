<!DOCTYPE html>
<html>
<head>
  <style>
    .u { text-decoration: underline; }
    .o { text-decoration: overline; }
    .l { text-decoration: line-through; }
    a { text-decoration: none; }
  </style>
</head>
<body>

  <p class="u">Underlined text</p>
  <p class="o">Overlined text</p>
  <p class="l">Line through text</p>
  <a href="#">Link without underline</a>

</body>
</html>
