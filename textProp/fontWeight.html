<!DOCTYPE html>
<html>
<head>
  <style>
    .w300 { font-weight: 300; }
    .w400 { font-weight: 400; }
    .w600 { font-weight: 600; }
    .w700 { font-weight: 700; }
    .w900 { font-weight: 900; }
  </style>
</head>
<body>

  <p class="w300">Light text</p>
  <p class="w400">Normal text</p>
  <p class="w600">Semi bold text</p>
  <p class="w700">Bold text</p>
  <p class="w900">Extra bold text</p>

</body>
</html>
