<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* rgb(a,b,c,d)
      a - value of red
      b - value of green
      c - value of blue
      d - opacity of color
     */
    h1{
      color: rgb(255,0,0,0.5);
    }
    h2{
      color: rgb(0,255,0,0.7);
    }
    h3{
      color: rgb(0,0,255,1);
    }
  </style>
</head>
<body>
  <h1>Red</h1>
  <h2>Green</h2>
  <h3>blue</h3>
</body>
</html>
