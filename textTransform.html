<!-- Important points
Only visual change, original text remains same
capitalize capitalizes first letter of each word
Commonly used for headings, buttons, nav items -->
<!DOCTYPE html>
<html>
<head>
  <style>
    .lower { text-transform: lowercase; }
    .upper { text-transform: uppercase; }
    .cap   { text-transform: capitalize; }
  </style>
</head>
<body>

  <p class="lower">HELLO WORLD</p>
  <p class="upper">hello world</p>
  <p class="cap">hello world</p>

</body>
</html>
