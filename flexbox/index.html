<!DOCTYPE html>
<html>
<head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color: #fff;
    font-family: sans-serif;
  }
  html,body{
    height : 100%;
    width : 100%;
  }
  body{
    background-color : #111;
  }
.container {
  display: flex;
  flex-direction: row;        /* main axis → horizontal */
  justify-content: centre;    /* main axis alignment */
  align-items: center;        /* cross axis alignment */
  height: 200px;
  border: 2px solid black;
}

.box {
  width: 50px;
  height: 50px;
  background: steelblue;
  margin: 5px;
}
</style>
</head>
<body>

<div class="container">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>

</body>
</html>
