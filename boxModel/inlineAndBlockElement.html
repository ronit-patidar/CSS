🟦 Block Elements

Block elements always start on a new line and take full width of the parent by default.
eg :
<div>Div</div>
<p>Paragraph</p>
<h1>Heading</h1>
<ul>List</ul>
<li>Item</li>
<section>Section</section>

🟨 Inline Elements

Inline elements stay in the same line and take only required width.
<span>Span</span>
<a>Link</a>
<b>Bold</b>
<i>Italic</i>
<img>
<label>
