<!-- vertical spaces between line -->
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Line Height Example</title>
  <style>
    p {
      font-size: 16px;
      line-height: 1.5;
      width: 300px;
      border: 1px solid black;
    }
  </style>
</head>
<body>

  <p>
    This is a paragraph to demonstrate the line height property in CSS.
    Increasing line height increases the space between lines of text and
    improves readability.
  </p>

</body>
</html>
