<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Z-Index Full Demo</title>
  <style>
    body {
      height: 1500px;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin-top: 60px;
    }

    .box {
      width: 150px;
      height: 150px;
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
    }

    /* BASIC OVERLAP */
    .red {
      background: red;
      top: 100px;
      left: 50px;
      z-index: 1;
    }

    .blue {
      background: blue;
      top: 140px;
      left: 90px;
      z-index: 2;
    }

    /* NEGATIVE Z-INDEX */
    .green {
      background: green;
      top: 180px;
      left: 130px;
      z-index: -1;
    }

    /* STACKING CONTEXT */
    .parent {
      position: relative;
      z-index: 1;
      margin-top: 350px;
      height: 250px;
      border: 3px dashed black;
    }

    .child1 {
      background: purple;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .child2 {
      background: orange;
      top: 60px;
      left: 60px;
      z-index: 200;
    }

    /* FIXED WITH Z-INDEX */
    .fixed {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 160px;
      height: 60px;
      background: black;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h2>1. Basic z-index (Blue on top)</h2>
  <div class="box red">Red (z:1)</div>
  <div class="box blue">Blue (z:2)</div>
  <div class="box green">Green (z:-1)</div>

  <h2>2. Stacking Context (Children inside Parent)</h2>
  <div class="parent">
    Parent (z-index:1)
    <div class="box child1">Child 1 (z:100)</div>
    <div class="box child2">Child 2 (z:200)</div>
  </div>

  <div class="fixed">Fixed Navbar (z:999)</div>

  <p style="margin-top: 500px;">Scroll to see fixed element stays on top.</p>

</body>
</html>
