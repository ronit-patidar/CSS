<!-- 🖼️ background-image property in CSS

The background-image property is used to set an image as the background of an element. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Image Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .section {
      height: 300px;
      margin-bottom: 40px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    /* 1. Basic background image */
    .bg-basic {
      background-image: url("https://picsum.photos/800/400");
    }

    /* 2. No repeat + position */
    .bg-norepeat {
      background-image: url("https://picsum.photos/400/200");
      background-repeat: no-repeat;
      background-position: center;
      background-color: black;
    }

    /* 3. Background size: cover */
    .bg-cover {
      background-image: url("https://picsum.photos/900/500");
      background-size: cover;
      background-position: center;
    }

    /* 4. Background size: contain */
    .bg-contain {
      background-image: url("https://picsum.photos/500/500");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #333;
    }

    /* 5. Fixed background */
    .bg-fixed {
      background-image: url("https://picsum.photos/1000/600");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }

    /* 6. Multiple background images */
    .bg-multiple {
      background-image:
        url("https://picsum.photos/200"),
        url("https://picsum.photos/900/400");
      background-repeat: no-repeat;
      background-position: top left, center;
      background-size: 150px, cover;
    }
  </style>
</head>
<body>

  <div class="section bg-basic">
    Basic Background Image
  </div>

  <div class="section bg-norepeat">
    No Repeat + Center
  </div>

  <div class="section bg-cover">
    Background Size: Cover
  </div>

  <div class="section bg-contain">
    Background Size: Contain
  </div>

  <div class="section bg-fixed">
    Fixed Background (Scroll)
  </div>

  <div class="section bg-multiple">
    Multiple Background Images
  </div>

</body>
</html>
