<!-- background-image → sets the image

background-size: cover → image cover the box,img may be croped
                contain -> image cover the box,img not croped
                auto -> image takes it own original size.

background-repeat: no-repeat → no tiling
                   repeat -> may may repeat if space left.

background-position: center → centered image -->
                    <!-- top,left,bottom -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Image Example</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: #fff;
      font-family: sans-serif;
    }
    html,body{
      height : 100%;
      width : 100%;
    }
    body{
      background-color : #111;
    }
    .box {
      width: 100vw;
      height: 100vh;
      border: 2px solid black;
      background-image: url("https://plus.unsplash.com/premium_photo-1693227521269-d90b70e3ee06?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dGVzdHxlbnwwfHwwfHx8MA%3D%3D");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }
  </style>
</head>
<body>

  <div class="box"></div>

</body>
</html>
