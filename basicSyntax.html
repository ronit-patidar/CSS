<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- writing css is separate file and linking with html file. -->
  <link rel="stylesheet" href="style.css">
  <!-- style tag -->
  <style> 
  /* h1 is selector  */
  /* color is property */
  /* red is value */
  h1{
    color: red;
  }
  </style>
  </head>
<body>
  <h1>Color through style tag.</h1>
  <!-- inline css -->
  <h2 style="color:blue">Color through inline css.</h2>
  <h3>Color through external css linked file.</h3>
</body>
</html>
